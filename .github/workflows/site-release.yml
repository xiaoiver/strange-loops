name: Verify website release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outputs/strange-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/strange-loop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: geb-website-${{ github.sha }}
          path: outputs/strange-loop/dist/experiences/geb
          if-no-files-found: error
